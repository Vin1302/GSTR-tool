name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gstr_tool/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gstr_tool/requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gstr_tool/requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s gstr_tool/tests -v
      - name: Build standalone executable
        working-directory: gstr_tool
        run: python -m PyInstaller --noconfirm --clean GSTRTool.spec
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item gstr_tool/dist/GSTRTool.exe release/GSTRTool.exe
          Copy-Item gstr_tool/README.md release/README.txt
          Compress-Archive -Path release/GSTRTool.exe,release/README.txt -DestinationPath release/GSTRTool-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GSTRTool-Windows
          path: release/GSTRTool-Windows.zip
          if-no-files-found: error
